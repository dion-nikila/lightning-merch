name: Verify public storefront
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
  pages: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Enable branch publication on first deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/$GITHUB_REPOSITORY/pages" >/dev/null; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/pages" -f 'source[branch]=gh-pages' -f 'source[path]=/'
          fi
      - name: Check Pages publication
        shell: bash
        run: |
          site=https://dion-nikila.github.io/lightning-merch
          for attempt in {1..12}; do
            if curl -fsSL "$site/sketch/?verify=$GITHUB_SHA" | grep -Fq 'paper.js?drawing=7'; then
              curl -fsS "$site/shop.js" -o /tmp/shop.js
              node --check /tmp/shop.js
              for item in {01..11}; do
                curl -fsS "$site/products/$item.png" -o "/tmp/sticker-$item.png"
              done
              exit 0
            fi
            sleep 10
          done
          exit 1
      - uses: actions/checkout@v4
      - name: Exercise the deployed shop on phone, tablet and desktop
        env:
          SHOP_URL: https://dion-nikila.github.io/lightning-merch/?verify=${{ github.sha }}
        run: |
          npm install --prefix "$RUNNER_TEMP/shop-tests" playwright-core@1.55.0
          NODE_PATH="$RUNNER_TEMP/shop-tests/node_modules" node scripts/test-ui.cjs
          SHOP_URL="https://dion-nikila.github.io/lightning-merch/sketch/?verify=$GITHUB_SHA" NODE_PATH="$RUNNER_TEMP/shop-tests/node_modules" node scripts/test-ui.cjs
      - name: Record public verification
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$RESULT" -f context='Live storefront' -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
